name: Deploy to ECS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: probiga-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trading-v4-ci-gate:
    name: Trading V4 Stage 0-3 gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      resolved_requirements_b64: ${{ steps.dependency_lock.outputs.payload }}
      resolved_requirements_sha256: ${{ steps.dependency_lock.outputs.sha256 }}
      adata_release_sha: ${{ steps.adata_release.outputs.git_sha }}
      adata_tree_sha256: ${{ steps.adata_release.outputs.tree_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-platform.txt

      - name: Scan tracked secrets before dependency installation
        run: python tools/scan_tracked_secrets.py

      - name: Install regression dependencies
        run: |
          # adata uses setuptools' legacy backend; freeze the exact backend
          # that both CI and the offline production build will execute.
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-platform.txt

      - name: Scan tracked secrets after dependency installation
        run: python tools/scan_tracked_secrets.py

      - name: Build and install the pinned adata release
        id: adata_release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_manifest < deploy/production_release.env
          test "${#release_manifest[@]}" -eq 10
          test "${release_manifest[0]}" = \
            PROBIGA_PRODUCTION_RELEASE_MANIFEST_VERSION=2
          test "${release_manifest[1]}" = \
            PROBIGA_PRODUCTION_LOCK_TARGET=cp314-manylinux_2_17_x86_64
          case "${release_manifest[5]}" in
            ADATA_RELEASE_SHA=*) \
              ADATA_RELEASE_SHA="${release_manifest[5]#ADATA_RELEASE_SHA=}" ;;
            *) exit 2 ;;
          esac
          case "${release_manifest[6]}" in
            ADATA_TREE_SHA256=*) \
              EXPECTED_ADATA_TREE_SHA256="${release_manifest[6]#ADATA_TREE_SHA256=}" ;;
            *) exit 2 ;;
          esac
          if [[ ! "$ADATA_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Repository variable ADATA_RELEASE_SHA must name a full lowercase Git commit" >&2
            exit 2
          fi
          ADATA_GIT="$RUNNER_TEMP/probiga-adata.git"
          ADATA_SOURCE="$RUNNER_TEMP/probiga-adata-source"
          ADATA_BUILD_SOURCE="$RUNNER_TEMP/probiga-adata-build-source"
          git init --bare "$ADATA_GIT"
          git --git-dir="$ADATA_GIT" config core.autocrlf false
          git --git-dir="$ADATA_GIT" remote add origin https://github.com/1nchaos/adata.git
          git --git-dir="$ADATA_GIT" fetch --no-tags --depth=1 origin "$ADATA_RELEASE_SHA"
          FETCHED_ADATA_SHA="$(git --git-dir="$ADATA_GIT" rev-parse \
            "FETCH_HEAD^{commit}")"
          if [ "$FETCHED_ADATA_SHA" != "$ADATA_RELEASE_SHA" ]; then
            echo "fetched adata commit differs from the reviewed release manifest" >&2
            exit 2
          fi
          mkdir "$ADATA_SOURCE" "$ADATA_BUILD_SOURCE"
          git --git-dir="$ADATA_GIT" archive "$FETCHED_ADATA_SHA" \
            | tar -xf - -C "$ADATA_SOURCE"
          git --git-dir="$ADATA_GIT" archive "$FETCHED_ADATA_SHA" \
            | tar -xf - -C "$ADATA_BUILD_SOURCE"
          SEAL_JSON="$(python -m server.common.adata_release seal \
            --source "$ADATA_SOURCE" --git-sha "$ADATA_RELEASE_SHA")"
          ADATA_TREE_SHA256="$(printf '%s' "$SEAL_JSON" | python -c \
            'import json,sys; print(json.load(sys.stdin)["tree_sha256"])')"
          [[ "$ADATA_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [ "$ADATA_TREE_SHA256" != "$EXPECTED_ADATA_TREE_SHA256" ]; then
            echo "adata tree digest differs from the reviewed release manifest" >&2
            echo "expected=$EXPECTED_ADATA_TREE_SHA256" >&2
            echo "actual=$ADATA_TREE_SHA256" >&2
            exit 2
          fi
          chmod -R a-w "$ADATA_SOURCE"
          python -m pip wheel --no-deps --no-build-isolation --no-index \
            --wheel-dir "$RUNNER_TEMP/adata-wheel" "$ADATA_BUILD_SOURCE"
          mapfile -t ADATA_WHEELS < <(find "$RUNNER_TEMP/adata-wheel" -maxdepth 1 \
            -type f -name '*.whl' -print)
          test "${#ADATA_WHEELS[@]}" -eq 1
          python -m pip install "${ADATA_WHEELS[0]}"
          export PYTHONPATH="$ADATA_SOURCE:$GITHUB_WORKSPACE"
          echo "PYTHONPATH=$ADATA_SOURCE:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import adata
          from adata.sentiment.hot import Hot
          from adata.stock.info import info
          from adata.stock.market.stock_market.stock_market import StockMarket
          assert Path(adata.__file__).resolve().is_relative_to(
              Path(__import__('os').environ['PYTHONPATH'].split(':', 1)[0]).resolve()
          )
          assert Hot and info and StockMarket
          PY
          echo "git_sha=$ADATA_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tree_sha256=$ADATA_TREE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Freeze the tested dependency set
        id: dependency_lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip freeze --all --exclude-editable \
            | awk 'tolower($0) !~ /^adata([[:space:]]|==|@)/' \
            | LC_ALL=C sort \
            > "$RUNNER_TEMP/probiga-resolved-requirements.txt"
          echo "payload=$(base64 -w0 "$RUNNER_TEMP/probiga-resolved-requirements.txt")" \
            >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/probiga-resolved-requirements.txt" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Run unified screener and core runtime regressions
        run: >-
          python -m pytest -q
          tests/test_screener.py
          tests/test_config.py
          tests/test_engines.py
          tests/test_market_radar.py
          tests/test_data_quality_check.py
          tests/test_scheduler_runtime.py
          tests/test_intraday_alert_rules.py
          tests/test_intraday_alert_core.py
          tests/test_quant_digest.py
          tests/test_daily_review_quant_api.py
          tests/test_evening_review_generate.py
          tests/test_early_briefing_generate.py
          tests/test_wecom_delivery.py
          tests/test_quality_gate.py

      - name: Validate independent V4 V5 V6 releases
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trading_release.py
          mapfile -t release_tests < <(cat \
            versions/trading_v4/releases/trading_v4.1.0-research/tests.txt \
            versions/trading_v5/releases/trading_v5.0.0-research/tests.txt \
            versions/trading_v6/releases/trading_v6.0.0-research/tests.txt \
            | sed '/^[[:space:]]*$/d' | sort -u)
          python -m pytest -q "${release_tests[@]}"

      - name: Validate fail-closed production boundary
        run: >-
          python tools/validate_production_release_boundary.py
          --require-git-anchor
          --expected-git-sha "${GITHUB_SHA}"

      - name: Run production governance regressions
        run: >-
          python -m pytest -q
          tests/test_production_release_boundary.py
          tests/test_deploy_console.py
          tests/test_hot_data_detail.py
          tests/test_portfolio_watch_modal_ui.py
          tests/test_api_error_handling.py
          tests/test_health_endpoints.py
          tests/test_scheduler_script_policy.py
          tests/test_scheduler_runtime.py
          tests/test_attest_qmt_daily_kline.py
          tests/test_bigqmt_strategy_pre_close.py
          tests/test_run_guojin_qmt_full_market_history_2024.py
          tests/test_run_strategy_governance_daily.py
          tests/test_prepare_strategy_governance_qmt_history.py
          tests/test_strategy_governance.py
          tests/test_strategy_governance_health.py
          tests/test_strategy_governance_ui.py
          tests/test_trading_v3_forward_evidence_version.py
          tests/test_trading_v3_mysql_acceptance.py

      - name: Run Trading V3 Layer 4 release regressions
        run: >-
          python -m pytest -q
          tests/test_trading_v3_horizon_models.py
          tests/test_trading_v3_horizon_artifact_registry.py
          tests/test_trading_v3_horizon_runtime_selection.py
          tests/test_trading_v3_continuous_calibration.py
          tests/test_trading_v3_shadow_intelligence_runtime.py
          tests/test_trading_v3_production_activation.py
          tests/test_trading_v3_research_api.py

  deployment-disabled:
    name: Production deployment disabled
    needs: trading-v4-ci-gate
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.PRODUCTION_DEPLOY_ENABLED != 'true' &&
          needs.trading-v4-ci-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why production was not changed
        run: |
          echo "::notice title=Production deployment disabled::CI passed, but this revision was not deployed. Complete the non-root ECS migration and set the repository variable PRODUCTION_DEPLOY_ENABLED=true to enable deployment."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Production deployment disabled

          CI passed, but this revision was **not deployed**. Complete the non-root ECS
          migration and set the repository variable `PRODUCTION_DEPLOY_ENABLED=true`
          before enabling automatic production deployment.
          EOF

  deploy:
    needs: trading-v4-ci-gate
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
          needs.trading-v4-ci-gate.result == 'success' }}
    runs-on: ubuntu-latest
    # An interrupted release is fully re-attested before the requested release
    # runs its own gates. Keep a 15-minute runner margin over the SSH command.
    timeout-minutes: 165
    environment: production
    concurrency:
      group: probiga-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production SSH identity
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          identity_errors=0
          if [ -z "$SERVER_HOST" ]; then
            echo "::error title=Production SSH identity::SERVER_HOST secret is missing"
            identity_errors=1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "::error title=Production SSH identity::SERVER_USER secret is missing"
            identity_errors=1
          fi
          if [ "$SERVER_USER" = root ]; then
            echo "::error title=Production SSH identity::SERVER_USER must be an unprivileged account, not root"
            identity_errors=1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error title=Production SSH identity::SSH_PRIVATE_KEY secret is missing"
            identity_errors=1
          fi
          if [[ ! "$SERVER_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error title=Production SSH identity::SERVER_HOST_FINGERPRINT must be an exact SHA256 fingerprint"
            identity_errors=1
          fi
          if [ "$identity_errors" -ne 0 ]; then
            exit 2
          fi
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test "$SERVER_USER" != root
          test -n "$SSH_PRIVATE_KEY"

      - name: Deploy to Alibaba Cloud ECS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RESOLVED_REQUIREMENTS_B64: ${{ needs.trading-v4-ci-gate.outputs.resolved_requirements_b64 }}
          EXPECTED_REQUIREMENTS_SHA256: ${{ needs.trading-v4-ci-gate.outputs.resolved_requirements_sha256 }}
          EXPECTED_ADATA_SHA: ${{ needs.trading-v4-ci-gate.outputs.adata_release_sha }}
          EXPECTED_ADATA_TREE_SHA256: ${{ needs.trading-v4-ci-gate.outputs.adata_tree_sha256 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          command_timeout: 150m
          envs: EXPECTED_SHA,RESOLVED_REQUIREMENTS_B64,EXPECTED_REQUIREMENTS_SHA256,EXPECTED_ADATA_SHA,EXPECTED_ADATA_TREE_SHA256
          script: |
            set -Eeuo pipefail
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$RESOLVED_REQUIREMENTS_B64" | \
              sudo -n /usr/local/sbin/probiga-production-deploy \
                "$EXPECTED_SHA" \
                "$EXPECTED_REQUIREMENTS_SHA256" \
                "$EXPECTED_ADATA_SHA" \
                "$EXPECTED_ADATA_TREE_SHA256"
