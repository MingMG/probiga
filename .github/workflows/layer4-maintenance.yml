name: Trading V3 Layer 4 production maintenance

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Forward migration or later Shadow-writer activation
        required: true
        type: choice
        options:
          - migrate
          - activate
      expected_sha:
        description: Exact deployed lowercase 40-character Git SHA
        required: true
        type: string
      allow_forward_recovery:
        description: Resume an interrupted forward migration; never rolls DDL back
        required: true
        default: false
        type: boolean
      approval_ack:
        description: Exact acknowledgement documented by the selected phase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # This intentionally matches the deploy job's remote mutation group.
  group: probiga-production-deploy
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate immutable maintenance request
        shell: bash
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
          REQUESTED_SHA: ${{ inputs.expected_sha }}
          REQUESTED_RECOVERY: ${{ inputs.allow_forward_recovery }}
          REQUESTED_ACK: ${{ inputs.approval_ack }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          case "$REQUESTED_PHASE:$REQUESTED_RECOVERY" in
            migrate:false)
              test "$REQUESTED_ACK" = I_CONFIRM_LAYER4_PRODUCTION_MIGRATION
              ;;
            migrate:true)
              test "$REQUESTED_ACK" = I_CONFIRM_LAYER4_FORWARD_RECOVERY
              ;;
            activate:false)
              test "$REQUESTED_ACK" = I_CONFIRM_LAYER4_SHADOW_WRITERS_ACTIVATION
              ;;
            *)
              echo "Invalid phase/recovery combination" >&2
              exit 2
              ;;
          esac
          python -m py_compile \
            server/common/trading_v3_maintenance.py \
            tools/trading_v3_layer4_maintenance.py
          bash -n deploy/layer4_maintenance.sh

  maintain:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    env:
      PROBIGA_DEPLOYMENT_MODE: production
      PROBIGA_EXPECTED_GIT_SHA: ${{ inputs.expected_sha }}
      PROBIGA_MAINTENANCE_PHASE: ${{ inputs.phase }}
      PROBIGA_MAINTENANCE_ALLOW_RESUME: ${{ inputs.allow_forward_recovery }}
      PROBIGA_MAINTENANCE_ACK: ${{ inputs.approval_ack }}
      PROBIGA_MAINTENANCE_RUN_ID: ${{ github.run_id }}
      PROBIGA_MAINTENANCE_ACTOR: ${{ github.actor }}
    steps:
      - name: Validate protected production SSH identity
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test "$SERVER_USER" != root
          test -n "$SSH_PRIVATE_KEY"
          [[ "$SERVER_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]

      - name: Run audited forward-only Layer 4 maintenance
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          PROBIGA_DEPLOYMENT_MODE: production
          PROBIGA_EXPECTED_GIT_SHA: ${{ inputs.expected_sha }}
          PROBIGA_MAINTENANCE_PHASE: ${{ inputs.phase }}
          PROBIGA_MAINTENANCE_ALLOW_RESUME: ${{ inputs.allow_forward_recovery }}
          PROBIGA_MAINTENANCE_ACK: ${{ inputs.approval_ack }}
          PROBIGA_MAINTENANCE_RUN_ID: ${{ github.run_id }}
          PROBIGA_MAINTENANCE_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          command_timeout: 60m
          envs: >-
            PROBIGA_DEPLOYMENT_MODE,
            PROBIGA_EXPECTED_GIT_SHA,
            PROBIGA_MAINTENANCE_PHASE,
            PROBIGA_MAINTENANCE_ALLOW_RESUME,
            PROBIGA_MAINTENANCE_ACK,
            PROBIGA_MAINTENANCE_RUN_ID,
            PROBIGA_MAINTENANCE_ACTOR
          script: |
            set -Eeuo pipefail
            active_code="/opt/ProBigA-releases/$PROBIGA_EXPECTED_GIT_SHA"
            test ! -L "$active_code"
            test -d "$active_code"
            test -L /opt/ProBigA-current
            test "$(readlink -f /opt/ProBigA-current)" = "$active_code"
            test "$(git -c safe.directory="$active_code" \
              -C "$active_code" rev-parse HEAD)" = \
              "$PROBIGA_EXPECTED_GIT_SHA"
            exec sudo -n /usr/bin/env -- \
              PROBIGA_DEPLOYMENT_MODE="$PROBIGA_DEPLOYMENT_MODE" \
              PROBIGA_EXPECTED_GIT_SHA="$PROBIGA_EXPECTED_GIT_SHA" \
              PROBIGA_MAINTENANCE_PHASE="$PROBIGA_MAINTENANCE_PHASE" \
              PROBIGA_MAINTENANCE_ALLOW_RESUME="$PROBIGA_MAINTENANCE_ALLOW_RESUME" \
              PROBIGA_MAINTENANCE_ACK="$PROBIGA_MAINTENANCE_ACK" \
              PROBIGA_MAINTENANCE_RUN_ID="$PROBIGA_MAINTENANCE_RUN_ID" \
              PROBIGA_MAINTENANCE_ACTOR="$PROBIGA_MAINTENANCE_ACTOR" \
              /bin/bash "$active_code/deploy/layer4_maintenance.sh"
