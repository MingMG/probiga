# ProBigA Oracle MySQL 8.4.11 production baseline.
#
# This file is intentionally local-disk-only.  During the restore rehearsal,
# start the same configuration with a command-line --port=33085 override.
# The registered production service must use the configured 3306 value.

[mysqld]
basedir=D:/MySQL84/software/mysql-8.4.11-winx64
datadir=E:/MySQL84/Data
port=3306
bind-address=127.0.0.1
mysqlx=OFF
shared-memory=OFF
named-pipe=OFF
skip-name-resolve=ON
lower_case_table_names=1

character-set-server=utf8mb4
collation-server=utf8mb4_general_ci
# default_collation_for_utf8mb4 is deliberately absent: on 8.4.11 it must be
# established with SET PERSIST after initialization and verified on restart.
default-time-zone=+08:00
transaction-isolation=REPEATABLE-READ
explicit-defaults-for-timestamp=ON
sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ZERO_DATE,NO_ZERO_IN_DATE,NO_ENGINE_SUBSTITUTION,ONLY_FULL_GROUP_BY

require-secure-transport=ON
tls-version=TLSv1.2,TLSv1.3
ssl-ca=D:/MySQL84/certs/ca.pem
ssl-cert=D:/MySQL84/certs/server-cert.pem
ssl-key=D:/MySQL84/certs/server-key.pem
mysql-native-password=OFF

innodb-file-per-table=ON
innodb-buffer-pool-size=8G
innodb-redo-log-capacity=2G
innodb-flush-log-at-trx-commit=1

log-bin=E:/MySQL84/Logs/mysql-bin
log-bin-index=E:/MySQL84/Logs/mysql-bin.index
binlog-format=ROW
binlog-row-image=FULL
sync-binlog=1
max-binlog-size=256M
binlog-expire-logs-seconds=259200
server-id=84011
# log_bin_trust_function_creators is intentionally not persisted.  Its normal
# value is OFF; an identity-gated maintenance wrapper may enable it only while
# frozen V2/V3/V4 triggers are being installed and must restore OFF in finally.

max-allowed-packet=256M
max-connections=100
event-scheduler=OFF
local-infile=OFF
secure-file-priv=NULL
performance-schema=ON

tmpdir=E:/MySQL84/Tmp
log-error=E:/MySQL84/Logs/mysql84.err
log-error-verbosity=2
pid-file=E:/MySQL84/Logs/mysql84.pid
slow-query-log=ON
slow-query-log-file=E:/MySQL84/Logs/mysql84-slow.log
long-query-time=2
general-log=OFF

[client]
protocol=tcp
host=127.0.0.1
port=3306
default-character-set=utf8mb4
ssl-mode=VERIFY_CA
ssl-ca=D:/MySQL84/certs/ca.pem
